<script>
    (function() {
        console.log("DEBUG!~!!!!!");
        var path = window.location.pathname;
        var links = document.querySelectorAll("nav menu a");
        for (var i = 0; i < links.length; i++) {
            var href = links[i].getAttribute("href");
            if (href !== "/" && path.indexOf(href) === 0) {
                links[i].classList.add("active");
            }
        }
    })();
</script>
